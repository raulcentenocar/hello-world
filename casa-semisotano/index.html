<!DOCTYPE html>
<html lang="es">
<head>
<title>Vivienda Semisótano 150</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..750&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: hoja de proyecto — panel de parámetros a la izquierda, láminas (plantas, sección, agrupación) a la derecha, cajetín de cifras arriba. */
:root{
  --site:#ece8dc; --asph:#6b7075; --lawn:#c7dbb3; --lawn-edge:#9fb98a; --pave:#e2ded4; --deck:#e4dccb; --tree:#6f9a5e; --tree-edge:#4f7a42; --roof:#fbfaf6; --roof-low:#d9d6cd;
  --paper:#eef0ec; --sheet:#fbfbf9; --ink:#1d2327; --muted:#5b6569; --rule:#c8cdc6;
  --accent:#1e6c68; --accent-soft:#d6e7e4; --below:#9a6b12; --below-soft:#f1e5cc;
  --wall:#262c30; --room:#fbfbf9; --terrain:#dcd5c3; --glass:#4f8fb8;
  --ok:#2e7d4f; --warn:#a86a00; --fail:#b3261e;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --site:#2a2b26; --asph:#4b4f53; --lawn:#33452c; --lawn-edge:#4c6640; --pave:#3a3934; --deck:#3a352b; --tree:#4f7a42; --tree-edge:#6f9a5e; --roof:#d9dbd6; --roof-low:#8b8d88;
  --paper:#13171a; --sheet:#1a1f22; --ink:#e4e7e2; --muted:#98a2a5; --rule:#343c40;
  --accent:#62b5ad; --accent-soft:#1f3634; --below:#d9a64a; --below-soft:#33291a;
  --wall:#cfd5d1; --room:#1a1f22; --terrain:#3b3529; --glass:#7fb6dc;
  --ok:#62c08a; --warn:#e0a640; --fail:#f07a70; color-scheme:dark }}
:root[data-theme="dark"]{
  --site:#2a2b26; --asph:#4b4f53; --lawn:#33452c; --lawn-edge:#4c6640; --pave:#3a3934; --deck:#3a352b; --tree:#4f7a42; --tree-edge:#6f9a5e; --roof:#d9dbd6; --roof-low:#8b8d88;
  --paper:#13171a; --sheet:#1a1f22; --ink:#e4e7e2; --muted:#98a2a5; --rule:#343c40;
  --accent:#62b5ad; --accent-soft:#1f3634; --below:#d9a64a; --below-soft:#33291a;
  --wall:#cfd5d1; --room:#1a1f22; --terrain:#3b3529; --glass:#7fb6dc;
  --ok:#62c08a; --warn:#e0a640; --fail:#f07a70; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 14px;border-bottom:1px solid var(--rule);background:var(--sheet)}
.top-in{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between;max-width:1600px;margin:0 auto}
.brand h1{font-family:var(--f-display);font-stretch:72%;font-weight:700;font-size:30px;line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.brand p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.kpis{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--ink)}
.kpi{padding:6px 12px;border-right:1px solid var(--rule);min-width:0}
.kpi:last-child{border-right:0}
.kpi b{display:block;font-family:var(--f-mono);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi.below b{color:var(--below)}
.kpi .st-ok{color:var(--ok)} .kpi .st-warn{color:var(--warn)} .kpi .st-fail{color:var(--fail)}

.wrap{display:grid;grid-template-columns:330px minmax(0,1fr);gap:0;max-width:1600px;margin:0 auto;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
aside{border-right:1px solid var(--rule);padding:14px 16px 40px;background:var(--sheet);min-width:0}
main{padding:14px 18px 48px;min-width:0}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  aside{border-right:0;border-top:1px solid var(--rule);padding-inline:0;order:2}
  main{padding-inline:0}
}

details.grp{border-top:1px solid var(--rule);padding:8px 0}
details.grp:first-of-type{border-top:0}
details.grp>summary{cursor:pointer;list-style:none;font-family:var(--f-display);font-stretch:85%;font-weight:650;font-size:13px;text-transform:uppercase;letter-spacing:.07em;display:flex;justify-content:space-between;align-items:center;padding:4px 0}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details.grp[open]>summary::after{content:"–"}
.fields{display:grid;gap:8px;padding:6px 0 4px}
.f{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;align-items:center}
.f label{font-size:13px;color:var(--ink)}
.f label small{display:block;color:var(--muted);font-size:11px;line-height:1.3}
.num{display:flex;align-items:center;border:1px solid var(--rule);background:var(--paper);border-radius:3px}
.num input{width:100%;min-width:0;border:0;background:transparent;padding:5px 6px;font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.num span{padding-right:6px;color:var(--muted);font-size:11px;font-family:var(--f-mono)}
.f input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:0}
.seg{display:flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden;grid-column:1/-1}
.seg button{flex:1;border:0;background:transparent;padding:7px 4px;cursor:pointer;font-size:13px;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--sheet)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;grid-column:1/-1;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.note{font-size:12px;color:var(--muted);margin:2px 0 0}

.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--ink);margin-bottom:14px}
.tabs button{border:1px solid transparent;border-bottom:0;background:transparent;padding:8px 12px;cursor:pointer;font-family:var(--f-display);font-stretch:85%;font-weight:600;font-size:14px;border-radius:3px 3px 0 0;color:var(--muted)}
.tabs button[aria-selected=true]{border-color:var(--ink);background:var(--sheet);color:var(--ink);margin-bottom:-1px}
.tabs button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:middle}

.tools{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.btn{border:1px solid var(--ink);background:var(--sheet);padding:6px 10px;border-radius:3px;cursor:pointer;font-size:13px}
.btn:hover{background:var(--accent-soft)}
.btn.pri{background:var(--ink);color:var(--sheet)}
.toast{font-size:12px;color:var(--ok);align-self:center}

.sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.sheet{background:var(--sheet);border:1px solid var(--rule);min-width:0}
.sheet header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule)}
.sheet h3{margin:0;font-family:var(--f-display);font-stretch:80%;font-weight:650;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.sheet header span{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.sheet.ss h3{color:var(--below)}
.svgbox{overflow-x:auto;padding:6px}
.svgbox svg{display:block;width:100%;height:auto;min-width:260px}
.svgbox.wide svg{min-width:640px}

svg .wall{fill:var(--wall)} svg .room{fill:var(--room)} svg .open{fill:var(--room)}
svg .med{fill:url(#hatch)}
svg .terr{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3}
svg .patio{fill:var(--below-soft);stroke:var(--below);stroke-width:1;stroke-dasharray:4 3}
svg .ramp{fill:var(--below-soft);stroke:var(--below);stroke-width:1}
svg .parcel{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:6 4}
svg .street{fill:var(--rule);opacity:.55}
svg .garden{fill:var(--accent-soft);opacity:.5}
svg .car{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:3 2}
svg .glass{stroke:var(--glass);stroke-width:1.2;fill:none}
svg .door{stroke:var(--ink);stroke-width:1;fill:none}
svg .swing{stroke:var(--muted);stroke-width:.8;fill:none;stroke-dasharray:2 2}
svg .stair{stroke:var(--ink);stroke-width:.8;fill:none}
svg .arrow{stroke:var(--accent);stroke-width:1.3;fill:none}
svg .dim{stroke:var(--muted);stroke-width:.8;fill:none}
svg .rampa{stroke:var(--below);stroke-width:1.3;fill:none}
svg text{font-family:var(--f-body);fill:var(--ink)}
svg .lbl{font-family:var(--f-display);font-stretch:85%;font-weight:600}
svg .area{font-family:var(--f-mono);fill:var(--muted)}
svg .dimt{font-family:var(--f-mono);fill:var(--muted)}
svg .acc{fill:var(--accent)} svg .bel{fill:var(--below)}
svg .lim{stroke:var(--below);stroke-width:1.4;stroke-dasharray:7 4;fill:none}
svg .limmax{stroke:var(--fail);stroke-width:1;stroke-dasharray:7 4;fill:none}
svg .ground{stroke:var(--ink);stroke-width:1.6;fill:none}
svg .soil{fill:var(--terrain)}
svg .air{fill:var(--sheet)}
svg .slab{fill:var(--wall)}
svg .lvl{stroke:var(--muted);stroke-width:.7;stroke-dasharray:2 3;fill:none}
svg .hatchline{stroke:var(--accent);stroke-width:1}

table{border-collapse:collapse;width:100%;font-size:13px}
.tbl{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule)}
th,td{padding:6px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{font-family:var(--f-display);font-stretch:85%;font-weight:650;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.floor td{background:var(--paper);font-family:var(--f-display);font-stretch:85%;font-weight:650;text-transform:uppercase;letter-spacing:.05em;font-size:12px}
tr.floor.ss td{color:var(--below)}
tr.tot td{font-weight:600;border-top:1px solid var(--ink)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.fail{color:var(--fail)} .pill.info{color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;margin-top:14px}
.prose{background:var(--sheet);border:1px solid var(--rule);padding:12px 16px;min-width:0}
.prose h4{margin:0 0 6px;font-family:var(--f-display);font-stretch:85%;font-weight:650;font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.prose ul{margin:0;padding-left:18px;display:grid;gap:4px}
.prose p{margin:0 0 6px;max-width:68ch}
.err{background:var(--sheet);border:1px solid var(--fail);color:var(--fail);padding:10px 14px;margin-bottom:12px}
.progwrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.progplans{display:grid;gap:14px;min-width:0}
@media (max-width:1100px){.progwrap{grid-template-columns:minmax(0,1fr)}}
.sel{width:100%;min-width:150px;border:1px solid var(--rule);background:var(--paper);border-radius:3px;padding:5px 6px;font-size:13px}
.num input:disabled{opacity:.45}
.ordwrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.ordside{display:grid;gap:14px;min-width:0}
@media (max-width:1200px){.ordwrap{grid-template-columns:minmax(0,1fr)}}
svg .ground{fill:var(--site);stroke:var(--ink);stroke-width:1.4}
svg .asph{fill:var(--asph)} svg .axis{stroke:#fff;stroke-opacity:.7;stroke-width:1.2;stroke-dasharray:8 7}
svg .lawn{fill:var(--lawn);stroke:var(--lawn-edge);stroke-width:.8} svg .pave{fill:var(--pave);stroke:var(--lawn-edge);stroke-width:.5}
svg .deck{fill:var(--deck)} svg .tree{fill:var(--tree);fill-opacity:.8;stroke:var(--tree-edge);stroke-width:.8}
svg .roof{fill:var(--roof);stroke:var(--ink);stroke-width:.06} svg .roofpb{fill:var(--roof-low);stroke:var(--ink);stroke-width:.06}
svg .parapet{fill:none;stroke:var(--muted);stroke-width:.7} svg .party{stroke:var(--ink);stroke-width:1}
svg .skylight{fill:var(--glass);fill-opacity:.35}
svg .carp{fill:none;stroke:var(--muted);stroke-width:.08}
svg .rampp{fill:var(--below-soft);stroke:var(--below);stroke-width:.8}
svg .hid{font-family:var(--f-mono);fill:var(--ink);font-weight:500} svg .inv{fill:#fff}
svg .entry{fill:var(--accent)} svg .tag{fill:var(--sheet);fill-opacity:.88;stroke:var(--rule)} svg .ground-line{stroke:var(--ink);stroke-width:2}
svg .retr{fill:none;stroke:var(--below);stroke-opacity:.18}
svg .zv{fill:var(--accent-soft)} svg .neigh{fill:var(--rule);opacity:.35}
svg .garage{fill:var(--below-soft);stroke:var(--below);stroke-width:1.2;stroke-dasharray:6 4;fill-opacity:.55}
svg .pgarden{fill:var(--accent-soft);stroke:var(--accent);stroke-width:.6}
svg .pfront{fill:var(--paper);stroke:var(--muted);stroke-width:.5}
svg .ramp.bad{fill:var(--fail);fill-opacity:.35}
svg .muted{fill:var(--muted)}
h2.step{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-stretch:85%;font-weight:650;font-size:17px;margin:18px 0 10px}
h2.step span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--sheet);font-size:13px;font-family:var(--f-mono)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.card{display:grid;grid-template-rows:auto 1fr;text-align:left;border:1px solid var(--rule);background:var(--sheet);padding:0;cursor:pointer;border-radius:4px;overflow:hidden;min-width:0}
.card:hover{border-color:var(--ink)}
.card[aria-pressed=true]{border:2px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card .thumb{background:var(--paper);border-bottom:1px solid var(--rule)} .card .thumb svg{display:block;width:100%;height:auto}
.card-b{padding:10px 12px;display:grid;gap:6px;align-content:start}
.card-b b{font-family:var(--f-display);font-stretch:85%;font-size:15px} .card-b small{color:var(--muted);font-size:12px;line-height:1.35}
.card dl{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:4px 0}
.card dl div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dotted var(--rule)} .card dt{font-size:11.5px;color:var(--muted)} .card dd{margin:0;font-family:var(--f-mono);font-size:12.5px}
.card .pill{justify-self:start}
.seg.mini{grid-column:auto;flex:0 0 auto} .seg.mini button{padding:5px 10px;font-size:12.5px}
.box3d{min-height:360px;background:var(--paper)} .box3d canvas{display:block;width:100%!important;height:auto!important;touch-action:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:6px 12px 10px;margin:0}
.legend .sw{display:inline-block;width:12px;height:12px;border:1px solid var(--rule);vertical-align:-2px;margin-right:4px}
.sw.lawn{background:var(--lawn)} .sw.pave{background:var(--pave)} .sw.asph{background:var(--asph)} .sw.deck{background:var(--deck)} .sw.retr{background:var(--below);opacity:.25}
.st-ok{color:var(--ok)} .st-warn{color:var(--warn)} .st-fail{color:var(--fail)}
textarea.out{width:100%;height:140px;font-family:var(--f-mono);font-size:11px;background:var(--paper);color:var(--ink);border:1px solid var(--rule);margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Vivienda <span>Semisótano</span> 150</h1>
      <p>Diseño paramétrico de vivienda unifamiliar PB+1 sobre semisótano no computable, en módulo de crujía apto para aislar, parear o adosar.</p>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>
</header>

<div class="wrap">
  <aside id="panel" aria-label="Parámetros del proyecto"></aside>
  <main>
    <div id="errors"></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <section id="view"></section>
  </main>
</div>

<script>
(() => {
"use strict";

/* ------------------------------------------------------------------ parámetros */
const CAT = {
  "Vestíbulo":{ min:2.5, nowin:1 }, "Cocina":{ min:7 }, "Cocina-comedor":{ min:12, liv:1 },
  "Salón-comedor":{ min:18, liv:1 }, "Salón":{ min:14, liv:1 }, "Comedor":{ min:8, liv:1 }, "Estudio":{ min:6 },
  "Dormitorio principal":{ min:10, dorm:1 }, "Dormitorio doble":{ min:8, dorm:1 }, "Dormitorio individual":{ min:6, dorm:1 },
  "Baño":{ min:3, bath:1 }, "Aseo":{ min:1.5, bath:1 }, "Baño en suite":{ min:3, bath:1, anexo:"dorm" }, "Vestidor":{ min:2, anexo:"dorm", nowin:1 },
  "Despensa":{ min:1, anexo:"cocina", nowin:1 }, "Lavadero":{ min:2 }, "Lavadero · despensa":{ min:2.5 }, "Armarios":{ nowin:1 }, "Paso a garaje comunitario":{ nowin:1 },
  "Trastero":{ nowin:1 }, "Bodega":{ nowin:1 }, "Sala polivalente":{}, "Gimnasio":{}, "Cuarto de juegos":{},
  "Instalaciones":{ nowin:1 }, "Instalaciones · lavandería":{}
};
const OPTS = {
  res:["Vestíbulo","Cocina","Cocina-comedor","Salón-comedor","Salón","Comedor","Estudio","Dormitorio principal","Dormitorio doble","Dormitorio individual","Baño","Aseo","Baño en suite","Vestidor","Despensa","Lavadero","Lavadero · despensa","Armarios"],
  ss:["Paso a garaje comunitario","Trastero","Bodega","Sala polivalente","Gimnasio","Cuarto de juegos","Instalaciones","Instalaciones · lavandería","Lavadero","Aseo","Despensa","Armarios"]
};
const ZONES = [["calle","A calle"],["nucleo","Núcleo interior"],["jardin","A jardín"]];
const PROG_DEF = {
  ss:{ calle:[{ t:"Trastero", a:6 }, { t:"Bodega", a:10 }], nucleo:[{ t:"Instalaciones", a:4 }, { t:"", a:3 }], jardin:[{ t:"Sala polivalente", a:9 }, { t:"Instalaciones · lavandería", a:11 }] },
  pb:{ calle:[{ t:"Vestíbulo", a:7.5 }, { t:"Cocina", a:10 }], nucleo:[{ t:"Aseo", a:3.5 }, { t:"Lavadero · despensa", a:3.5 }], jardin:[{ t:"Salón-comedor", a:22 }, { t:"", a:6 }] },
  p1:{ calle:[{ t:"Dormitorio doble", a:8 }, { t:"Dormitorio doble", a:9.5 }], nucleo:[{ t:"Baño", a:6 }, { t:"", a:3 }], jardin:[{ t:"Dormitorio principal", a:13 }, { t:"Baño en suite", a:5 }] }
};
const clone = o => JSON.parse(JSON.stringify(o));
function normProg(pr){
  const out = clone(PROG_DEF);
  if (pr && typeof pr === "object") for (const lv in out) for (const z in out[lv]) for (let i = 0; i < 2; i++){
    const q = pr[lv] && pr[lv][z] && pr[lv][z][i];
    if (q && typeof q.t === "string" && (q.t === "" || CAT[q.t]) && isFinite(+q.a)) out[lv][z][i] = { t:q.t, a:Math.max(0, +q.a) };
  }
  return out;
}
const DEF = {
  tipo:"pareada", espejo:false, nUnid:4,
  edif:150, modo:"ajustar", p1Alineada:true, W:7.00, Wd:1.90,

/* ------------------------------------------------------------------ utilidades */
const fmt = (n, d=2) => (Math.round(n * 10**d) / 10**d).toFixed(d).replace(".", ",").replace(/^-0,0+$/, "0,00");
const sgn = n => (n > 0.0001 ? "+" : n < -0.0001 ? "−" : "±") + fmt(Math.abs(n));
const ceil05 = v => Math.ceil(v / 0.05 - 1e-9) * 0.05;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

/* ------------------------------------------------------------------ modelo */
function colX(p, W, medL, medR){
  const x0 = medL ? p.tM : p.tE, x1 = W - (medR ? p.tM : p.tE);
  const Ws = 2 * p.ancho + p.ojo, xA1 = x0 + Ws, xD1 = xA1 + p.Wd;
  return { x0, x1, xA1, xD1, xB0:xD1 + p.tP, Ws };
}
function isAnexo(s, host){
  const c = CAT[s.t]; if (!c || !c.anexo || !host || !host.t) return false;
  const h = CAT[host.t] || {};
  return c.anexo === "dorm" ? !!h.dorm : /^Cocina/.test(host.t);
}
/* reparte una banda (a calle o a jardín) entre 1 o 2 estancias; todas deben abrir al distribuidor salvo los anexos */
function splitBand(slots, X, zone, tP){
  const { x0, x1, xA1, xD1 } = X;
  const rs = slots.map((q, i) => Object.assign({}, q, { i })).filter(q => q.t);
  if (!rs.length) return [];
  if (rs.length === 1) return [Object.assign(rs[0], { xa:x0, xb:x1, anexo:false })];
  const [Lr, Rr] = rs;
  const dLo = zone === "jardin" ? x0 : xA1;
  const anL = isAnexo(Lr, Rr), anR = isAnexo(Rr, Lr);
  const aL = Math.max(Lr.a, 0.5), aR = Math.max(Rr.a, 0.5);
  let xm = x0 + (x1 - x0 - tP) * aL / (aL + aR);
  const lo = Math.max(x0 + 1.2, anL ? 0 : dLo + 0.8);
  const hi = Math.min(x1 - tP - 1.2, anR ? Infinity : xD1 - tP - 0.8);
  xm = Math.min(Math.max(xm, lo), Math.max(hi, lo));
  return [Object.assign(Lr, { xa:x0, xb:xm, anexo:anL }), Object.assign(Rr, { xa:xm + tP, xb:x1, anexo:anR })];
}
function roomNames(prog){
  let n = 2; const out = {};
  for (const lv of ["ss","pb","p1"]){ out[lv] = {};
    for (const z of ["calle","nucleo","jardin"]) out[lv][z] = prog[lv][z].map(q => !q.t ? "" : (CAT[q.t].dorm && q.t !== "Dormitorio principal") ? "Dormitorio " + (n++) : q.t); }
  return out;
}
function compute(p){
  const f = p.forj, W = p.W, tE = p.tE, tP = p.tP;
  const X = colX(p, W, p.tipo !== "aislada", p.tipo === "adosada");
  const rise1 = p.ssLibre + f, rise2 = p.hPB + f;
  const n1 = Math.ceil(rise1 / p.cmax - 1e-9), n2 = Math.ceil(rise2 / p.cmax - 1e-9);
  const r1 = Math.ceil(Math.max(n1, n2) / 2);
  const treads = r1 - 1;
  const Ls = ceil05(treads * p.huella + 2 * p.ancho);
  const Ws = X.Ws;
  const prog = p.prog;
  const dep = (lv, z) => { const parts = splitBand(prog[lv][z], X, z, tP); return parts.length ? Math.max(...parts.map(r => r.a / (r.xb - r.xa))) : 0; };
  const fReq = Math.max(dep("pb","calle"), dep("p1","calle"), 1.2);
  const rPB = dep("pb","jardin"), rP1 = dep("p1","jardin");
  let Fd = fReq, RdPB = Math.max(rPB, rP1, 1.2), RdP1 = p.p1Alineada ? RdPB : Math.max(rP1, 1.2);
  const K = 2 * tE + 2 * tP + Ls;
  const reqTotal = W * (2 * K + 2 * Fd + RdPB + RdP1);
  let s = 1;
  if (p.modo === "ajustar") s = Math.max(0.3, (p.edif / W - 2 * K) / (2 * Fd + RdPB + RdP1));
  Fd *= s; RdPB *= s; RdP1 *= s;
  let garMin = false;
  if (p.garaje && Fd + tP + Ls < 5.0){ Fd = 5.0 - Ls - tP; garMin = true; }
  const Dpb = K + Fd + RdPB, Dp1 = K + Fd + RdP1;
  const Apb = W * Dpb, Ap1 = W * Dp1;
  const ssTop = p.ssSobre, ssFloor = p.ssSobre - f - p.ssLibre;
  const dh = Math.max(0, -ssFloor);
  const rampLen = p.garaje ? dh / (p.pendRampa / 100) + p.meseta : 0;
  const setback = Math.max(p.retFrente, rampLen);
  const zPB = ssTop, zP1 = zPB + p.hPB + f, zRoof = zP1 + p.hP1 + f;
  return { p, W, X, Apb, Ap1, Dpb, Dp1, Ws, Ls, treads, n1, n2, c1:rise1/n1, c2:rise2/n2, rise1, rise2,
           front:Fd, rear:RdPB, rearP1:RdP1, s, reqTotal, garMin, prog, names:roomNames(prog),
           ssTop, ssFloor, dh, rampLen, setback, zPB, zP1, zRoof };
}

/* geometría de planta: x a lo largo de fachada, y en profundidad (0 = fachada a calle) */
function buildFloor(M, level, opt){
  const p = M.p, W = M.W, tE = p.tE, tP = p.tP;
  const medL = opt.medL, medR = opt.medR;
  const X = colX(p, W, medL, medR);
  const tL = X.x0, tR = W - X.x1;
  const D = level === "p1" ? M.Dp1 : M.Dpb;
  const g = { W, D, level, rects:[], lines:[], polys:[], texts:[], rooms:[] };
  const x0 = tL, x1 = W - tR;
  const xA1 = X.xA1, xD1 = X.xD1, xB0 = X.xB0;
  const yF0 = tE, yF1 = tE + M.front, yC0 = yF1 + tP, yC1 = yC0 + M.Ls, yR0 = yC1 + tP, yR1 = D - tE;
  const yE0 = yC1 - p.ancho;
  const R = (x, y, w, h, c) => g.rects.push({ x, y, w, h, c });
  const L = (x1_, y1_, x2_, y2_, c) => g.lines.push({ x1:x1_, y1:y1_, x2:x2_, y2:y2_, c });
  const T = (x, y, t, c, s, rot) => g.texts.push({ x, y, t, c, s, rot:rot || 0 });
  const room = (name, rs, o = {}) => {
    let a = 0; rs.forEach(r => { R(r[0], r[1], r[2], r[3], "room"); a += r[2] * r[3]; });
    const big = rs[0], cx = o.lx ?? big[0] + big[2] / 2, cy = o.ly ?? big[1] + big[3] / 2;
    const s = Math.max(0.15, Math.min(0.34, (big[2] - 0.15) / (name.length * 0.5)));
    const sa = Math.max(0.15, Math.min(0.24, (big[2] - 0.1) / 4.6));
    T(cx, cy + s * 0.45, name, "lbl", s);
    T(cx, cy - sa * 1.0, fmt(a) + " m²", "area", sa);
    g.rooms.push({ name, area:a, w:big[2], h:big[3], key:o.key || name, t:o.t || "", target:o.target, anexo:!!o.anexo, level, zone:o.zone });
  };
  const win = (a, b, side) => {
    const y0 = side === "f" ? 0 : D - tE, y1 = y0 + tE;
    R(a, y0, b - a, tE, "open");
    L(a, y0, b, y0, "glass"); L(a, y1, b, y1, "glass"); L(a, (y0 + y1) / 2, b, (y0 + y1) / 2, "glass");
    L(a, y0, a, y1, "door"); L(b, y0, b, y1, "door");
  };
  const arcPts = (cx, cy, r, a0, a1) => { const pts = []; for (let i = 0; i <= 10; i++){ const a = a0 + (a1 - a0) * i / 10; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } return pts; };
  /* puerta en tabique horizontal (orient h: muro en y∈[p0,p1]) o vertical (orient v: x∈[p0,p1]) */
  const door = (orient, p0, p1, c, w, dir, leaf = true) => {
    const a = c - w / 2, b = c + w / 2;
    if (orient === "h"){
      R(a, p0, w, p1 - p0, "open"); L(a, p0, a, p1, "door"); L(b, p0, b, p1, "door");
      if (!leaf) return;
      const e = dir > 0 ? p1 : p0;
      L(a, e, a, e + dir * w, "door");
      g.polys.push({ pts:arcPts(a, e, w, dir > 0 ? Math.PI / 2 : -Math.PI / 2, 0), c:"swing" });
    } else {
      R(p0, a, p1 - p0, w, "open"); L(p0, a, p1, a, "door"); L(p0, b, p1, b, "door");
      if (!leaf) return;
      const e = dir > 0 ? p1 : p0;
      L(e, a, e + dir * w, a, "door");
      g.polys.push({ pts:arcPts(e, a, w, 0, Math.PI / 2).map(([x, y]) => [e + dir * (x - e), y]), c:"swing" });
    }
  };
  const stair = (label) => {
    R(x0, yC0, M.Ws, yE0 - yC0, "room");
    const ya = yC0 + p.ancho;
    L(x0, ya, xA1, ya, "stair");
    for (let i = 1; i <= M.treads; i++){
      const y = ya + i * p.huella; if (y > yE0 + 1e-6) break;
      L(x0, y, x0 + p.ancho, y, "stair"); L(xA1 - p.ancho, y, xA1, y, "stair");
    }
    L(x0 + p.ancho, ya, x0 + p.ancho, yE0, "stair"); L(xA1 - p.ancho, ya, xA1 - p.ancho, yE0, "stair");
    L(xA1, yC0, xA1, yE0, "stair");
    const xf1 = x0 + p.ancho / 2, xf2 = xA1 - p.ancho / 2, ym = yC0 + p.ancho / 2;
    g.polys.push({ pts:[[xf2, yE0 - 0.15], [xf2, ym], [xf1, ym], [xf1, yE0 - 0.35]], c:"arrow" });
    g.polys.push({ pts:[[xf1 - 0.12, yE0 - 0.15], [xf1, yE0 - 0.35], [xf1 + 0.12, yE0 - 0.15]], c:"arrow" });
    T(x0 + M.Ws / 2, yE0 + 0.22 + p.ancho * 0, label, "area", 0.17);
    g.rooms.push({ name:"Escalera", area:M.Ws * (yE0 - yC0), w:M.Ws, h:yE0 - yC0, key:"esc", noLabel:true });
  };

  /* contorno */
  R(0, 0, W, D, "wall");
  if (medL) R(0, 0, tL, D, "med");
  if (medR) R(W - tR, 0, tR, D, "med");

  const fd = yF1 - yF0, rd = yR1 - yR0;
  const prog = M.prog[level], names = M.names[level];
  const ssGar = level === "ss" && p.garaje;

  const band = (zone, ya, yb) => {
    const front = zone === "calle";
    const parts = splitBand(prog[zone], X, zone, tP);
    const wy0 = front ? yF1 : yC1, wy1 = front ? yC0 : yR0, dir = front ? -1 : 1;
    if (!parts.length){
      room("Libre", [[x0, ya, x1 - x0, yb - ya]], { key:level + "." + zone + ".x", zone });
      door("h", wy0, wy1, (xA1 + xD1) / 2, 0.82, dir);
      if (level === "pb" && front) door("h", 0, tE, (x0 + x1) / 2, 0.95, 1);
      return;
    }
    let ent = -1;
    if (level === "pb" && front){ ent = parts.findIndex(r => r.t === "Vestíbulo"); if (ent < 0) ent = parts.findIndex(r => !r.anexo); }
    parts.forEach((r, j) => {
      const c = CAT[r.t] || {};
      room(names[zone][r.i], [[r.xa, ya, r.xb - r.xa, yb - ya]], { key:`${level}.${zone}.${r.i}`, t:r.t, target:r.a, anexo:r.anexo, zone });
      if (r.anexo){
        const px0 = j === 0 ? r.xb : parts[0].xb;
        door("v", px0, px0 + tP, front ? yb - 0.55 : ya + 0.55, Math.min(0.72, yb - ya - 0.3), j === 0 ? -1 : 1);
      } else {
        let lo, hi;
        if (ssGar && !front){
          if (Math.min(r.xb, xA1) - Math.max(r.xa, x0) >= 0.8){ lo = Math.max(r.xa, x0); hi = Math.min(r.xb, xA1); }
          else { lo = Math.max(r.xa, xA1 + tP); hi = r.xb; }
        } else { lo = Math.max(r.xa, front ? xA1 : x0); hi = Math.min(r.xb, xD1); }
        if (hi - lo >= 0.6){
          if (c.liv && level === "pb") door("h", wy0, wy1, (lo + hi) / 2, Math.max(0.8, hi - lo - 0.3), dir, false);
          else { const w = Math.min(0.82, hi - lo - 0.1); door("h", wy0, wy1, Math.min(Math.max((lo + hi) / 2, lo + w / 2 + 0.05), hi - w / 2 - 0.05), w, dir); }
        }
      }
      if (j === ent){ door("h", 0, tE, (r.xa + r.xb) / 2, 0.95, 1); return; }
      const canWin = !c.nowin && !(level === "ss" && (front || !p.patio));
      if (canWin){
        const w = r.xb - r.xa, ww = c.liv ? w * 0.72 : Math.min(w - 0.7, 2.0);
        if (ww > 0.5){ const cx = (r.xa + r.xb) / 2; win(cx - ww / 2, cx + ww / 2, front ? "f" : "r"); }
      }
    });
  };
  const core = () => {
    const rs = prog.nucleo.map((q, i) => Object.assign({}, q, { i })).filter(q => q.t);
    if (!rs.length) return false;
    const bw = x1 - xB0, tot = M.Ls - tP;
    let hs = [M.Ls];
    if (rs.length === 2){ const a0 = Math.max(rs[0].a, 0.5), a1 = Math.max(rs[1].a, 0.5); let h1 = tot * a0 / (a0 + a1); h1 = Math.min(Math.max(h1, 1.0), tot - 1.0); hs = [h1, tot - h1]; }
    let y = yC0;
    rs.forEach((r, j) => {
      const h = hs[j];
      room(names.nucleo[r.i], [[xB0, y, bw, h]], { key:`${level}.nucleo.${r.i}`, t:r.t, target:r.a, zone:"nucleo" });
      door("v", xD1, xB0, y + h / 2, Math.min(0.75, h - 0.2), 1);
      y += h + tP;
    });
    return true;
  };

  if (ssGar){
    const q0 = prog.calle[0];
    room(q0.t ? names.calle[0] : "Libre", [[x0, yF0, M.Ws, fd]], { key:"ss.calle.0", t:q0.t, target:q0.a, zone:"calle" });
    stair("Sube");
    room("Vestíbulo previo", [[x0, yE0, M.Ws, yC1 - yE0]], { key:"vest" });
    const gx = xA1 + tP, gw = x1 - gx, gd = yC1 - yF0;
    room("Garaje", [[gx, yF0, gw, gd]], { ly: yF0 + gd * 0.62, key:"garaje" });
    const n = gd >= 5 ? Math.floor((gw + 0.001) / 2.5) : 0;
    for (let i = 0; i < n; i++){
      const cx = gx + gw * (i + 0.5) / n;
      g.rects.push({ x:cx - 0.9, y:yF0 + 0.35, w:1.8, h:4.4, c:"car" });
    }
    g.plazas = n; g.garW = gw; g.garD = gd;
    const dw = Math.min(gw - 0.3, n >= 2 ? 4.6 : 2.8), dc = gx + gw / 2;
    R(dc - dw / 2, 0, dw, tE, "open"); L(dc - dw / 2, tE / 2, dc + dw / 2, tE / 2, "door");
    L(dc - dw / 2, 0, dc - dw / 2, tE, "door"); L(dc + dw / 2, 0, dc + dw / 2, tE, "door");
    g.garageDoor = { a:dc - dw / 2, b:dc + dw / 2 };
    door("v", xA1, xA1 + tP, (yF0 + yF1) / 2, Math.min(0.8, fd - 0.3), -1);
    door("v", xA1, xA1 + tP, (yE0 + yC1) / 2, Math.min(0.8, yC1 - yE0 - 0.05), -1);
    band("jardin", yR0, yR1);
  } else {
    g.garageDoor = null;
    band("calle", yF0, yF1);
    stair(level === "p1" ? "Baja" : "Sube");
    const hasCore = core();
    room("Distribuidor", [[xA1, yC0, hasCore ? p.Wd : x1 - xA1, M.Ls], [x0, yE0, M.Ws, yC1 - yE0]], { key:level + ".dist" });
    band("jardin", yR0, yR1);
  }
  if (level === "ss" && p.patio){
    g.rects.push({ x:x0, y:D, w:x1 - x0, h:p.patioF, c:"patio" });
    T((x0 + x1) / 2, D + p.patioF / 2 - 0.08, "Patio inglés", "area", 0.2);
  }
  if (level === "p1" && M.Dpb - M.Dp1 > 0.05){
    g.rects.push({ x:0, y:D, w:W, h:M.Dpb - D, c:"terr" });
    T(W / 2, D + (M.Dpb - D) / 2 - 0.08, "Terraza sobre PB · " + fmt(W * (M.Dpb - D)) + " m²", "area", 0.2);
  }

  /* cotas */
  const dimH = (a, b, y, txt) => { L(a, y, b, y, "dim"); L(a, y - 0.12, a, y + 0.12, "dim"); L(b, y - 0.12, b, y + 0.12, "dim"); T((a + b) / 2, y + 0.12, txt, "dimt", 0.18); };
  const dimV = (a, b, x, txt) => { L(x, a, x, b, "dim"); L(x - 0.12, a, x + 0.12, a, "dim"); L(x - 0.12, b, x + 0.12, b, "dim"); T(x - 0.12, (a + b) / 2, txt, "dimt", 0.18, -90); };
  dimH(0, W, -1.45, fmt(W));
  dimH(x0, xA1, -0.75, fmt(xA1 - x0)); dimH(xA1, xD1, -0.75, fmt(p.Wd)); dimH(xB0, x1, -0.75, fmt(x1 - xB0));
  dimV(0, D, -1.45, fmt(D));
  dimV(yF0, yF1, -0.75, fmt(fd)); dimV(yC0, yC1, -0.75, fmt(M.Ls)); dimV(yR0, yR1, -0.75, fmt(rd));
  T(W / 2, -2.05, "CALLE · fachada principal", "dimt", 0.2);

  if (opt.mirror) mirrorGeom(g);
  return g;
}
function mirrorGeom(g){
  const W = g.W, m = x => W - x;
  g.rects.forEach(r => { r.x = W - r.x - r.w; });
  g.lines.forEach(l => { l.x1 = m(l.x1); l.x2 = m(l.x2); });
  g.polys.forEach(q => { q.pts = q.pts.map(([x, y]) => [m(x), y]); });
  g.texts.forEach(t => { t.x = m(t.x); if (t.rot) t.x = t.x + 0.24; });
  if (g.garageDoor) g.garageDoor = { a:m(g.garageDoor.b), b:m(g.garageDoor.a) };
}

/* ------------------------------------------------------------------ SVG */
let uid = 0;
function geomSVG(list, frame, S, extra = ""){
  const id = "h" + (++uid);
  const [fx0, fy0, fx1, fy1] = frame;
  const Wpx = (fx1 - fx0) * S, Hpx = (fy1 - fy0) * S;
  const X = (x, ox) => ((x + ox) - fx0) * S, Y = (y, oy) => (fy1 - (y + oy)) * S;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${Wpx.toFixed(1)} ${Hpx.toFixed(1)}" role="img">`;
  s += `<defs><pattern id="${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="wall"/><line x1="0" y1="0" x2="0" y2="6" class="hatchline" stroke-width="2.4"/></pattern></defs>`;
  s += extra;
  for (const it of list){
    const g = it.g, ox = it.ox || 0, oy = it.oy || 0, skip = it.skip || {};
    for (const r of g.rects){
      const cls = r.c === "med" ? "" : r.c;
      const fill = r.c === "med" ? ` fill="url(#${id})"` : "";
      s += `<rect x="${X(r.x, ox).toFixed(1)}" y="${Y(r.y + r.h, oy).toFixed(1)}" width="${(r.w * S).toFixed(1)}" height="${(r.h * S).toFixed(1)}" class="${cls}"${fill}/>`;
    }
    for (const l of g.lines){ if (skip.dim && l.c === "dim") continue;
      s += `<line x1="${X(l.x1, ox).toFixed(1)}" y1="${Y(l.y1, oy).toFixed(1)}" x2="${X(l.x2, ox).toFixed(1)}" y2="${Y(l.y2, oy).toFixed(1)}" class="${l.c}"/>`; }
    for (const q of g.polys) s += `<polyline points="${q.pts.map(([x, y]) => X(x, ox).toFixed(1) + "," + Y(y, oy).toFixed(1)).join(" ")}" class="${q.c}"/>`;
    for (const t of g.texts){
      if (skip.text && (t.c === "lbl" || t.c === "area")) continue;
      if (skip.dim && t.c === "dimt") continue;
      const x = X(t.x, ox), y = Y(t.y, oy);
      const tr = t.rot ? ` transform="rotate(${t.rot} ${x.toFixed(1)} ${y.toFixed(1)})"` : "";
      s += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="${(t.s * S).toFixed(1)}" class="${t.c}"${tr}>${esc(t.t)}</text>`;
    }
  }
  return s + "</svg>";
}

function sectionSVG(M){
  const p = M.p, S = 30, sb = M.setback, f = p.forj;
  const u0 = -2, u1 = sb + M.Dpb + Math.max(p.retFondo, p.patio ? p.patioF : 0) + 2;
  const z0 = Math.min(M.ssFloor, 0) - 1.1, z1 = Math.max(M.zRoof + 1.2, p.alturaMax + 0.6);
  const padR = 150, padL = 14;
  const W = (u1 - u0) * S + padL + padR, H = (z1 - z0) * S + 30;
  const X = u => padL + (u - u0) * S, Y = z => 10 + (z1 - z) * S;
  const rect = (ua, ub, za, zb, c) => `<rect x="${X(Math.min(ua, ub)).toFixed(1)}" y="${Y(Math.max(za, zb)).toFixed(1)}" width="${(Math.abs(ub - ua) * S).toFixed(1)}" height="${(Math.abs(zb - za) * S).toFixed(1)}" class="${c}"/>`;
  const line = (ua, za, ub, zb, c) => `<line x1="${X(ua).toFixed(1)}" y1="${Y(za).toFixed(1)}" x2="${X(ub).toFixed(1)}" y2="${Y(zb).toFixed(1)}" class="${c}"/>`;
  const text = (u, z, t, c, sz = 11, anchor = "start") => `<text x="${X(u).toFixed(1)}" y="${Y(z).toFixed(1)}" font-size="${sz}" class="${c}" text-anchor="${anchor}">${esc(t)}</text>`;
  const a = sb, b = sb + M.Dpb, b1 = sb + M.Dp1, tE = p.tE;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" role="img" aria-label="Sección longitudinal">`;
  /* terreno */
  s += rect(u0, u1, M.ssFloor - 0.9, 0, "soil");
  s += rect(a, b, M.ssFloor - 0.15, 0, "air");
  if (p.garaje && M.dh > 0){
    const r0 = sb - M.rampLen, r1 = r0 + p.meseta;
    s += `<polygon points="${X(r1)},${Y(0)} ${X(a)},${Y(M.ssFloor)} ${X(a)},${Y(0)}" class="air"/>`;
    s += `<polyline points="${X(u0)},${Y(0)} ${X(r1)},${Y(0)} ${X(a)},${Y(M.ssFloor)}" class="rampa"/>`;
    s += text((r1 + a) / 2, M.ssFloor / 2 - 0.45, `Rampa ${p.pendRampa}% · ${fmt(M.rampLen - p.meseta)} m`, "bel", 11, "middle");
    if (p.meseta > 0) s += text((r0 + r1) / 2, 0.15, `Meseta ${fmt(p.meseta)}`, "bel", 10, "middle");
  } else s += line(u0, 0, a, 0, "ground");
  if (p.patio){ s += rect(b, b + p.patioF, M.ssFloor, 0, "air"); s += rect(b + p.patioF, b + p.patioF + 0.25, M.ssFloor - 0.3, 0.1, "slab"); }
  s += line(p.patio ? b + p.patioF + 0.25 : b, 0, u1, 0, "ground");
  /* semisótano */
  s += rect(a, b, M.ssFloor - 0.3, M.ssFloor, "slab");
  const wallSeg = (u, w, za, zb, gaps) => { let out = "", z = za; (gaps || []).forEach(([g0, g1]) => { if (g0 > z) out += rect(u, u + w, z, g0, "slab"); out += rect(u + w * 0.4, u + w * 0.6, g0, g1, "glass-fill"); z = g1; }); if (zb > z) out += rect(u, u + w, z, zb, "slab"); return out; };
  const zs = M.ssFloor, zsT = M.ssTop - f;
  s += wallSeg(a, tE, zs, zsT, p.garaje ? [[zs, zs + 2.2]] : [[zsT - 0.7, zsT - 0.1]]);
  s += wallSeg(b - tE, tE, zs, zsT, p.patio ? [[zs + 0.9, zsT - 0.1]] : []);
  s += rect(a, b, zsT, M.ssTop, "slab");
  s += text((a + b) / 2, zs + p.ssLibre / 2 + 0.25, "SEMISÓTANO", "lbl bel", 13, "middle");
  s += text((a + b) / 2, zs + p.ssLibre / 2 - 0.25, "no computa · h libre " + fmt(p.ssLibre), "area", 11, "middle");
  /* planta baja */
  const zp = M.zPB, zpT = zp + p.hPB;
  s += wallSeg(a, tE, zp, zpT, [[zp + 0.0, zp + 2.2]]);
  s += wallSeg(b - tE, tE, zp, zpT, [[zp, zp + 2.3]]);
  s += rect(a, b, zpT, zpT + f, "slab");
  s += text((a + b) / 2, zp + p.hPB / 2 + 0.2, "PLANTA BAJA", "lbl", 13, "middle");
  s += text((a + b) / 2, zp + p.hPB / 2 - 0.3, fmt(M.Apb) + " m² computables", "area", 11, "middle");
  /* planta primera */
  const zq = M.zP1, zqT = zq + p.hP1;
  s += wallSeg(a, tE, zq, zqT, [[zq + 0.9, zq + 2.2]]);
  s += wallSeg(b1 - tE, tE, zq, zqT, [[zq + 0.9, zq + 2.2]]);
  s += rect(a, b1, zqT, zqT + f, "slab");
  s += rect(a, a + 0.2, zqT + f, zqT + f + 0.6, "slab"); s += rect(b1 - 0.2, b1, zqT + f, zqT + f + 0.6, "slab");
  if (b - b1 > 0.05) s += line(b - 0.05, zpT + f, b - 0.05, zpT + f + 1.0, "door") + line(b1, zpT + f + 1.0, b - 0.05, zpT + f + 1.0, "door");
  s += text((a + b1) / 2, zq + p.hP1 / 2 + 0.2, "PLANTA PRIMERA", "lbl", 13, "middle");
  s += text((a + b1) / 2, zq + p.hP1 / 2 - 0.3, fmt(M.Ap1) + " m² computables", "area", 11, "middle");
  /* líneas de referencia */
  s += line(u0, p.ssLimite, u1, p.ssLimite, "lim");
  s += text(u0 + 0.1, p.ssLimite + 0.12, `Límite semisótano ${sgn(p.ssLimite)}`, "bel", 10.5);
  s += line(u0, p.alturaMax, u1, p.alturaMax, "limmax");
  s += text(u0 + 0.1, p.alturaMax + 0.12, `Altura máxima ${fmt(p.alturaMax)}`, "area", 10.5);
  s += line(0, z0 + 0.3, 0, M.zRoof + 0.6, "lvl") + text(0.1, z0 + 0.45, "Alineación", "area", 10);
  /* cotas a la derecha */
  const lv = [[0, "±0,00 rasante"], [M.ssFloor, sgn(M.ssFloor) + " suelo semisótano"], [M.ssTop, sgn(M.ssTop) + " planta baja"], [M.zP1, sgn(M.zP1) + " planta primera"], [M.zRoof, sgn(M.zRoof) + " cornisa"]];
  const ux = u1;
  lv.forEach(([z, t]) => { s += line(b1 > b ? b1 : b, z, ux + 0.2, z, "lvl"); s += `<polygon points="${X(ux)},${Y(z)} ${X(ux) - 5},${Y(z) - 7} ${X(ux) + 5},${Y(z) - 7}" class="acc"/>`; s += text(ux + 0.35, z - 0.08, t, "dimt", 11); });
  /* cota altura total */
  const ud = a - 0.9;
  s += line(ud, 0, ud, M.zRoof, "dim") + line(ud - 0.15, 0, ud + 0.15, 0, "dim") + line(ud - 0.15, M.zRoof, ud + 0.15, M.zRoof, "dim");
  s += `<text x="${X(ud) - 5}" y="${Y(M.zRoof / 2)}" font-size="11" class="dimt" text-anchor="middle" transform="rotate(-90 ${X(ud) - 5} ${Y(M.zRoof / 2)})">${fmt(M.zRoof)} a cornisa</text>`;
  return s.replace(/class="glass-fill"/g, 'class="air"') + "</svg>";
}

/* agrupación: unidades con espejo alterno, núcleos de escalera y húmedos espalda con espalda */
function unitsFor(M){
  const p = M.p, W = M.W, rl = p.retLat;
  const out = [];
  if (p.tipo === "aislada"){
    const pw = Math.max(p.frente, W + 2 * rl);
    out.push({ mirror:p.espejo, L:false, R:false, pw, hx:(pw - W) / 2 });
  } else if (p.tipo === "pareada"){
    out.push({ mirror:true, L:false, R:true, pw:W + rl, hx:rl });
    out.push({ mirror:false, L:true, R:false, pw:W + rl, hx:0 });
  } else {
    const n = p.nUnid;
    for (let k = 0; k < n; k++){
      const L = k > 0, R = k < n - 1;
      out.push({ mirror:k % 2 === 0, L, R, pw:W + (L ? 0 : rl) + (R ? 0 : rl), hx:L ? 0 : rl });
    }
  }
  return out;
}
function agrupSVG(M){
  const p = M.p, units = unitsFor(M);
  const list = []; let ox = 0;
  const extraRects = { rects:[], lines:[], polys:[], texts:[], W:0, D:0 };
  units.forEach((u, i) => {
    const g = buildFloor(M, "pb", { medL:u.mirror ? u.R : u.L, medR:u.mirror ? u.L : u.R, mirror:u.mirror });
    const hx = ox + u.hx, hy = M.setback;
    extraRects.rects.push({ x:ox, y:0, w:u.pw, h:p.fondo, c:"garden" });
    extraRects.rects.push({ x:ox, y:0, w:u.pw, h:p.fondo, c:"parcel" });
    if (p.patio) extraRects.rects.push({ x:hx + p.tE, y:hy + M.Dpb, w:M.W - 2 * p.tE, h:p.patioF, c:"patio" });
    if (p.garaje && M.rampLen > 0){
      const gd = buildFloor(M, "ss", { medL:u.mirror ? u.R : u.L, medR:u.mirror ? u.L : u.R, mirror:u.mirror }).garageDoor;
      if (gd){
        const ra = hx + (gd.a + gd.b) / 2 - 1.5, y0 = hy - M.rampLen;
        extraRects.rects.push({ x:ra, y:y0, w:3.0, h:M.rampLen, c:"ramp" });
        extraRects.lines.push({ x1:ra, y1:y0 + p.meseta, x2:ra + 3, y2:y0 + p.meseta, c:"rampa" });
        extraRects.polys.push({ pts:[[ra + 1.5, y0 + p.meseta + 0.4], [ra + 1.5, hy - 0.4]], c:"rampa" });
        extraRects.polys.push({ pts:[[ra + 1.2, hy - 0.9], [ra + 1.5, hy - 0.4], [ra + 1.8, hy - 0.9]], c:"rampa" });
      }
    }
    extraRects.texts.push({ x:ox + u.pw / 2, y:p.fondo - 1.0, t:"V" + (i + 1), c:"lbl", s:0.7 });
    extraRects.texts.push({ x:ox + u.pw / 2, y:p.fondo - 1.9, t:fmt(u.pw) + " × " + fmt(p.fondo) + " m", c:"area", s:0.42 });
    list.push({ g, ox:hx, oy:hy, skip:{ dim:true } });
    ox += u.pw;
  });
  extraRects.rects.push({ x:-1, y:-6, w:ox + 2, h:6, c:"street" });
  extraRects.texts.push({ x:ox / 2, y:-3.3, t:"VIAL PÚBLICO", c:"lbl", s:0.6 });
  const frame = [-1.2, -6.2, ox + 1.2, p.fondo + 0.8];
  const S = Math.max(5, Math.min(22, 900 / (frame[2] - frame[0])));
  return { svg:geomSVG([{ g:extraRects }, ...list], frame, S), units, total:ox };
}

/* ------------------------------------------------------------------ DXF (R12, metros) */
const LAYERS = { wall:["A-MUROS",7], med:["A-MEDIANERA",1], room:["A-ESTANCIAS",8], glass:["A-CARPINTERIA",5], door:["A-CARPINTERIA",5], swing:["A-PUERTAS",9], stair:["A-ESCALERA",3], arrow:["A-ESCALERA",3], dim:["A-COTAS",2], dimt:["A-COTAS",2], lbl:["A-TEXTOS",7], area:["A-TEXTOS",7], car:["A-MOBILIARIO",9], terr:["A-TERRAZA",4], patio:["A-EXTERIOR",30], open:null };
function dxf(geoms){
  const o = [];
  const add = (...a) => o.push(...a.map(String));
  const layerNames = [...new Set(Object.values(LAYERS).filter(Boolean).map(v => v[0]))];
  add(0,"SECTION",2,"HEADER",9,"$ACADVER",1,"AC1009",9,"$INSUNITS",70,6,0,"ENDSEC");
  add(0,"SECTION",2,"TABLES",0,"TABLE",2,"LAYER",70,layerNames.length);
  layerNames.forEach(n => { const col = Object.values(LAYERS).find(v => v && v[0] === n)[1]; add(0,"LAYER",2,n,70,0,62,col,6,"CONTINUOUS"); });
  add(0,"ENDTAB",0,"ENDSEC",0,"SECTION",2,"ENTITIES");
  const line = (x1, y1, x2, y2, ly) => add(0,"LINE",8,ly,10,x1.toFixed(4),20,y1.toFixed(4),30,0,11,x2.toFixed(4),21,y2.toFixed(4),31,0);
  geoms.forEach(({ g, ox, title }) => {
    g.rects.forEach(r => { const L = LAYERS[r.c]; if (!L) return; const a = r.x + ox, b = r.y;
      line(a, b, a + r.w, b, L[0]); line(a + r.w, b, a + r.w, b + r.h, L[0]); line(a + r.w, b + r.h, a, b + r.h, L[0]); line(a, b + r.h, a, b, L[0]); });
    g.lines.forEach(l => { const L = LAYERS[l.c]; if (L) line(l.x1 + ox, l.y1, l.x2 + ox, l.y2, L[0]); });
    g.polys.forEach(q => { const L = LAYERS[q.c]; if (!L) return; for (let i = 1; i < q.pts.length; i++) line(q.pts[i-1][0] + ox, q.pts[i-1][1], q.pts[i][0] + ox, q.pts[i][1], L[0]); });
    g.texts.forEach(t => { const L = LAYERS[t.c] || ["A-TEXTOS",7]; const x = (t.x + ox).toFixed(4), y = t.y.toFixed(4);
      add(0,"TEXT",8,L[0],10,x,20,y,30,0,40,(t.s * 0.8).toFixed(3),1,t.t.normalize("NFD").replace(/[̀-ͯ]/g, "").replace("²","2"),50,t.rot || 0,72,1,73,2,11,x,21,y,31,0); });
    if (title) add(0,"TEXT",8,"A-TEXTOS",10,(ox + g.W / 2).toFixed(4),20,(-3).toFixed(4),30,0,40,0.4,1,title,72,1,73,2,11,(ox + g.W / 2).toFixed(4),21,(-3).toFixed(4),31,0);
  });
  add(0,"ENDSEC",0,"EOF");
  return o.join("\r\n");
}

/* ------------------------------------------------------------------ comprobaciones */
function checks(M, F){
  const p = M.p, c = [];
  const st = (ok, warn) => ok ? "ok" : warn ? "warn" : "fail";
  const parcela = p.frente * p.fondo;
  const add = (grp, label, val, lim, s, note) => c.push({ grp, label, val, lim, s, note });
  const tot = M.Apb + M.Ap1, dif = tot - p.edif;
  add("Edificabilidad", "Superficie computable (PB + P1)", fmt(tot) + " m²", "objetivo " + fmt(p.edif) + " m²", Math.abs(dif) < 0.05 ? "ok" : dif > 0 ? "fail" : "ok",
    "Construida sobre rasante: " + fmt(M.Apb) + " + " + fmt(M.Ap1) + " m²." + (Math.abs(dif) < 0.05 ? "" : dif > 0 ? " El programa supera el objetivo en " + fmt(dif) + " m²: reduce estancias o usa el modo Ajustar." : " Quedan " + fmt(-dif) + " m² de edificabilidad sin usar."));
  const emax = p.coef * parcela;
  add("Edificabilidad", "Edificabilidad de parcela", fmt(M.Apb + M.Ap1) + " m²", "≤ " + fmt(emax) + " m² (" + fmt(p.coef) + " × " + fmt(parcela) + ")", st(M.Apb + M.Ap1 <= emax + 0.01), "");
  add("Edificabilidad", "Semisótano no computable", "cara sup. forjado " + sgn(p.ssSobre), "≤ " + sgn(p.ssLimite) + " sobre rasante", st(p.ssSobre <= p.ssLimite + 1e-6), "Criterio habitual en ordenanzas: la planta no computa si su techo no supera la cota indicada sobre la rasante del terreno o acera. Verifica la definición exacta (cara superior o inferior, punto de medición) en tu PGOU.");
  if (M.ssFloor > -0.0001) add("Edificabilidad", "Semisótano enterrado", "suelo " + sgn(M.ssFloor), "bajo rasante", "fail", "Con estos valores el semisótano no queda por debajo de la rasante.");
  const ocup = M.W * M.Dpb / parcela * 100;
  add("Ordenanza", "Ocupación en planta", fmt(ocup, 1) + " %", "≤ " + fmt(p.ocupMax, 0) + " %", st(ocup <= p.ocupMax + 0.01), "Semisótano bajo la huella de la planta baja.");
  add("Ordenanza", "Altura a cornisa", fmt(M.zRoof) + " m", "≤ " + fmt(p.alturaMax) + " m · 2 plantas", st(M.zRoof <= p.alturaMax + 0.001), "Medida desde rasante a cara superior del último forjado. Pretiles de cubierta aparte.");
  add("Ordenanza", "Fondo edificable", fmt(M.Dpb) + " m", "≤ " + fmt(p.fondoMax) + " m", st(M.Dpb <= p.fondoMax + 0.001), "");
  const free = p.tipo === "aislada" ? 2 : p.tipo === "pareada" ? 1 : 0;
  const reqF = M.W + free * p.retLat;
  add("Ordenanza", "Frente de parcela", fmt(p.frente) + " m", "≥ " + fmt(reqF) + " m (" + p.tipo + ")", st(p.frente >= reqF - 0.001, p.tipo === "adosada"), p.tipo === "adosada" ? "Vivienda intermedia. Las cabeceras de hilera necesitan " + fmt(M.W + p.retLat) + " m." : "");
  const rearNeed = Math.max(p.retFondo, p.patio ? p.patioF : 0);
  const reqD = M.setback + M.Dpb + rearNeed;

  }

  const res = [...F.pb.rooms, ...F.p1.rooms];
  [...res, ...F.ss.rooms].filter(r => r.t && CAT[r.t] && CAT[r.t].min).forEach(r => {
    const cc = CAT[r.t], minSide = Math.min(r.w, r.h), sideMin = cc.liv ? 3.0 : cc.dorm ? 2.0 : 0;

      st(r.area >= cc.min - 0.005 && minSide >= sideMin - 0.005, r.area >= cc.min * 0.85), r.t !== r.name ? r.t : ""); });

  [["Cocina", t => /^Cocina/.test(t)], ["Salón o comedor", t => CAT[t].liv], ["Dormitorio", t => CAT[t].dorm], ["Baño completo", t => t === "Baño" || t === "Baño en suite"]].forEach(([n, fn]) =>

  res.filter(r => r.t && CAT[r.t].anexo && !r.anexo).forEach(r => add("Programa", r.name + " sin pieza principal", "abre al distribuidor", CAT[r.t].anexo === "dorm" ? "junto a un dormitorio" : "junto a la cocina", "warn", "Colócalo en la misma banda que " + (CAT[r.t].anexo === "dorm" ? "un dormitorio" : "la cocina") + " para que se acceda desde ella."));

  if (M.garMin) add("Programa", "Fondo mínimo por el garaje", "banda a calle " + fmt(M.front) + " m", "garaje ≥ 5,00 m de fondo", "warn", "La banda a calle se ha alargado para que quepa el coche; la superficie construida sube.");
  add("Habitabilidad", "Crujías vivideras", "delantera " + fmt(M.front) + " · trasera " + fmt(M.rearP1) + " m", "≥ 2,50 m", st(M.front >= 2.5 && M.rearP1 >= 2.5, M.front >= 2.2 && M.rearP1 >= 2.2), "Fondo libre en P1 junto a fachada trasera.");

  add("Agrupación", "Medianera", "doble hoja independiente", "DB HR", "info", "Cada vivienda tiene su propia hoja de " + fmt(p.tM) + " m con junta y banda elástica. Permite construir por fases y cumplir el aislamiento acústico entre unidades.");
  return c;
}

  <h2 class="step"><span>1</span>Elige un esquema de implantación</h2>
  <div class="cards" id="ordcards"></div>
  <h2 class="step"><span>2</span>Ajusta y revisa</h2>
  <div class="ordwrap">
    <article class="sheet"><header><h3 id="ordtitle">Ordenación</h3>
      <div class="seg mini" role="group" aria-label="Vista">${[["cubiertas","Cubiertas"],["planta","Planta baja"],["3d","3D"]].map(([v, t]) => `<button type="button" id="ordv-${v}" data-ordv="${v}" aria-pressed="${o.vista === v}">${t}</button>`).join("")}</div></header>
      <div class="svgbox wide" id="ordsvg"></div><div id="ord3d" class="box3d" hidden></div>
      <p class="note legend"><i class="sw lawn"></i>jardín privado <i class="sw pave"></i>acceso y aparcamiento privado <i class="sw asph"></i>vial <i class="sw deck"></i>patio común <i class="sw retr"></i>retranqueo 3 m · cabeceras en color</p>
    </article>
    <div class="ordside">
      <div class="kpis" id="ordkpi"></div>
      <div class="prose" id="ordctl"><h4>Ajustes</h4>
        <div class="fields">
          ${num("objetivo", "Viviendas objetivo", "ud", 8, 34, 1, "Máximo de la cédula: 34")}
          <div class="f" id="ordpark"><label>Aparcamiento en parcela</label><div class="seg">${[["superficie","2 plazas en el frente"],["rampa","Garaje con rampa"]].map(([v, t]) => `<button type="button" data-ordset="parking" data-v="${v}" aria-pressed="${o.parking === v}">${t}</button>`).join("")}</div></div>
          ${num("wCalle", "Ancho del vial privado", "m", 5, 12, 0.5, "Calzada + aceras")}
          ${num("gMin", "Jardín trasero mínimo", "m", 3, 15, 0.5)}
          ${num("paseo", "Paseo peatonal (patio)", "m", 3, 15, 0.5)}
          ${num("bloque", "Viviendas por bloque", "ud", 0, 20, 1, "0 = hileras continuas")}
          ${num("pasoBloque", "Paso entre bloques", "m", 2, 10, 0.5)}
        </div>
        <p class="note">Ancho ${fmt(M.W)} m y fondo ${fmt(M.Dpb)} m de cada vivienda: vienen del modelo (panel izquierdo y pestaña Programa).</p>
      </div>
    </div>
  </div>
  <h2 class="step"><span>3</span>Comprobaciones y cifras</h2>
  <div class="cols" id="ordtables" style="margin-top:0"></div>`;
}
let ORDC = { key:"", res:null };
function updateOrd(M){
  const o = P.ord;
  const key = JSON.stringify([o, M.W, M.Dpb, M.Dp1, M.ssFloor, P.pendRampa, P.meseta, P.tE, P.tM]);
  if (ORDC.key !== key){ ORDC = { key, res:Object.fromEntries(SCHEMES.map(sc => [sc.k, layoutScheme(M, sc.k, o)])) }; }
  const all = ORDC.res, L = all[o.esquema] || all.patio; LAST.O = L;
  const comp = M.Apb + M.Ap1;
  const stateOf = X => (X.n === UA.viv && X.n * comp <= UA.edif + 0.5 && X.plazas >= 2 * X.n && Math.min(...X.minD) >= 2.999) ? "ok" : X.n >= UA.viv * 0.9 ? "warn" : "fail";
  $("#ordcards").innerHTML = SCHEMES.map(sc => { const X = all[sc.k], stt = stateOf(X);
    return `<button type="button" class="card" data-scheme="${sc.k}" aria-pressed="${o.esquema === sc.k}">
      <div class="thumb">${ordSVG(M, X, { simple:true })}</div>
      <div class="card-b"><b>${sc.name}</b><small>${sc.sub}</small>
      <dl><div><dt>Viviendas</dt><dd class="${X.n === UA.viv ? "st-ok" : "st-warn"}">${X.n} / ${UA.viv}</dd></div><div><dt>Jardín medio</dt><dd>${fmt(X.gMed, 0)} m²</dd></div>
      <div><dt>Plazas</dt><dd class="${X.plazas >= 2 * X.n ? "" : "st-fail"}">${X.plazas}</dd></div><div><dt>Viario</dt><dd>${fmt(X.viario, 0)} m²</dd></div></dl>
      <span class="pill ${stt}">${stt === "ok" ? "Cumple" : stt === "warn" ? "Casi" : "No llega"}</span></div></button>`; }).join("");
  const scn = SCHEMES.find(s => s.k === o.esquema) || SCHEMES[0];
  $("#ordtitle").textContent = scn.name + " · UA-03-01";
  $("#ordpark").hidden = o.esquema === "patio";
  document.querySelectorAll("[data-ordv]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.ordv === o.vista)));
  document.querySelectorAll('[data-ordset="parking"]').forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === o.parking)));
  const is3d = o.vista === "3d";
  $("#ordsvg").hidden = is3d; $("#ord3d").hidden = !is3d;
  if (is3d){
    const box = $("#ord3d");
    if (!R3 || !box.contains(R3.renderer.domElement)) box.innerHTML = `<p class="note" style="padding:20px">Cargando el modelo 3D…</p>`;
    loadThree().then(() => render3D(box, M, L)).catch(() => { box.innerHTML = `<p class="note" style="padding:20px">No se pudo cargar el visor 3D en este navegador. La planta sigue disponible en Cubiertas o Planta baja.</p>`; });
  } else $("#ordsvg").innerHTML = ordSVG(M, L);
  const edif = L.n * comp, ocup = L.foot / UA.sup * 100, plz = 2 * L.n;
  const st = (ok, warn) => ok ? "ok" : warn ? "warn" : "fail";
  const lbl = { ok:"Cumple", warn:"Revisar", fail:"No cumple", info:"Info" };
  const minZV = Math.min(L.minD[2], L.minD[3], L.minD[4]);
  const acceso = L.parking === "comunitario" ? "Rampa única desde Calle Floristas al garaje comunitario; acceso peatonal a las viviendas por el patio." :
    L.parking === "rampa" ? "Cada vivienda baja a su garaje en semisótano con rampa propia desde el vial." : "Cada vivienda aparca 2 coches en su frente, con acceso directo desde el vial.";
  const C = [
    ["Número de viviendas", L.n + " ud", "≤ " + UA.viv + " ud", st(L.n === UA.viv, L.n <= UA.viv), L.n < UA.viv ? "Este esquema no admite más de " + L.rows.reduce((a, r) => a + r.fit, 0) + " viviendas con estos ajustes." : ""],
    ["Edificabilidad", fmt(edif) + " m²c", "≤ " + fmt(UA.edif) + " m²c", st(edif <= UA.edif + 0.5), L.n + " × " + fmt(comp) + " m²c"],
    ["Ocupación sobre parcela", fmt(ocup, 1) + " %", "≤ " + UA.ocup + " %", st(ocup <= UA.ocup), fmt(L.foot) + " m² de huella"],
    ["Altura", fmt(M.zRoof) + " m · 2 plantas", "≤ 7,50 m · 2 plantas", st(M.zRoof <= UA.altura + 1e-6), "Coronación máxima 10,50 m"],
    ["Retranqueo a Avenida de la Dehesa", fmt(L.minD[0]) + " m", "≥ 3,00 m", st(L.minD[0] >= 2.999), ""],
    ["Retranqueo a Calle Floristas", fmt(L.minD[5]) + " m", "≥ 3,00 m", st(L.minD[5] >= 2.999), ""],
    ["Separación a la zona verde ZV-02", fmt(minZV) + " m", "≥ 3,00 m", st(minZV >= 2.999), "Lectura conservadora de linderos y testeros."],
    ["Separación a la parcela UA-03-02", fmt(L.minD[1]) + " m", "≥ 3,00 m en extremo de hilera", st(L.minD[1] >= 2.999), ""],
    ["Plazas de aparcamiento", L.plazas + " plazas", plz + " (2 por vivienda)", st(L.plazas >= plz, L.plazas >= plz * 0.85), L.parking === "comunitario" ? "Capacidad estimada del garaje comunitario (≈ 27 m² por plaza)." : L.parking === "rampa" ? "Plazas dentro del garaje de cada semisótano según el ancho de fachada." : "Dos plazas en batería en el frente de cada parcela (fondo " + fmt(L.fP) + " m)."],
    ["Acceso rodado", L.parking === "comunitario" ? "garaje comunitario" : "desde vial", "a cada vivienda", L.k === "avenida" ? "warn" : "ok", acceso + (L.k === "avenida" ? " La hilera sur entra desde la Avenida de la Dehesa: la cédula fija el acceso por Calle Floristas, así que hay que confirmarlo con el Ayuntamiento." : "")],
    ...L.streets.map(s => ["Vial privado " + s.id.slice(1), fmt(s.len, 1) + " × " + fmt(s.t1 - s.t0, 1) + " m", "fondo de saco con giro", s.len > 0 ? "ok" : "fail", "Martillo de giro de 12 × " + fmt(s.t1 - s.t0 + 10, 1) + " m al final."]),
    ["Viviendas por promoción", L.n + " ud", "mínimo 8", st(L.n >= 8), ""]
  ];
  $("#ordkpi").innerHTML = `
    <div class="kpi"><b class="${L.n === UA.viv ? "st-ok" : "st-warn"}">${L.n} / ${UA.viv}</b><small>Viviendas</small></div>
    <div class="kpi"><b>${fmt(edif, 0)}</b><small>m²c de 5.100</small></div>
    <div class="kpi"><b>${fmt(ocup, 1)} %</b><small>Ocupación</small></div>
    <div class="kpi"><b>${fmt(L.gMed, 0)} m²</b><small>Jardín medio</small></div>`;
  const rowsT = L.rows.map(r => `<tr><td>Hilera ${r.id}</td><td class="n">${r.n}${r.n < r.fit ? ` <small class="note">de ${r.fit}</small>` : ""}</td><td>${r.n ? r.houses.filter(h => h.cab).length + " cabeceras" : "—"}</td><td>jardín al ${r.gardenDir}<br><small class="note">entrada por el ${r.frontDir}</small></td><td class="n">${r.n ? fmt(r.houses.reduce((a, h) => a + polyArea(h.garden), 0) / r.n, 0) : "—"} m²</td></tr>`).join("");
  $("#ordtables").innerHTML = `
    <div class="tbl"><table><thead><tr><th>Comprobación UA-03-01</th><th>Propuesta</th><th>Cédula</th><th>Estado</th></tr></thead><tbody>
      ${C.map(c => `<tr><td>${c[0]}${c[4] ? `<br><small class="note">${c[4]}</small>` : ""}</td><td class="n" style="text-align:left">${c[1]}</td><td>${c[2]}</td><td><span class="pill ${c[3]}">${lbl[c[3]]}</span></td></tr>`).join("")}
    </tbody></table></div>
    <div style="display:grid;gap:14px;align-content:start">
    <div class="tbl"><table><thead><tr><th>Hilera</th><th class="n">Viv.</th><th>Tipos</th><th>Orientación</th><th class="n">Jardín</th></tr></thead><tbody>${rowsT}
      <tr class="tot"><td>Total</td><td class="n">${L.n}</td><td colspan="2">${L.houses.filter(h => !h.cab).length} intermedias · ${L.houses.filter(h => h.cab).length} cabeceras</td><td class="n">${fmt(L.gMed, 0)} m²</td></tr></tbody></table></div>
    <div class="tbl"><table><thead><tr><th>Reparto del suelo</th><th class="n">m²</th><th class="n">%</th></tr></thead><tbody>
      ${[["Huella de viviendas", L.foot], ["Jardines privados", L.gardens], ["Acceso y aparcamiento privado", L.yards], ["Viario privado", L.viario], ["Patio y espacio común", L.comun]].map(([t, a]) => `<tr><td>${t}</td><td class="n">${fmt(a, 0)}</td><td class="n">${fmt(a / UAG.area * 100, 1)}</td></tr>`).join("")}
      <tr class="tot"><td>Parcela</td><td class="n">${fmt(UAG.area, 0)}</td><td class="n">100,0</td></tr>
      ${L.garagePoly ? `<tr><td>Garaje comunitario bajo rasante</td><td class="n">${fmt(L.garageA, 0)}</td><td class="n">—</td></tr>` : ""}
    </tbody></table></div></div>`;
}

/* exportación */
function dxfAll(){
  const { M, F } = LAST, gap = 6;
  return dxf([{ g:F.ss, ox:0, title:"SEMISOTANO" }, { g:F.pb, ox:M.W + gap, title:"PLANTA BAJA" }, { g:F.p1, ox:2 * (M.W + gap), title:"PLANTA PRIMERA" }]);
}
const SVG_STYLE = `<style>.wall,.slab{fill:#262c30}.room,.open,.air{fill:#fff}.hatchline{stroke:#1e6c68}.terr{fill:#d6e7e4;stroke:#1e6c68;stroke-dasharray:4 3}.patio,.ramp{fill:#f1e5cc;stroke:#9a6b12}.parcel{fill:none;stroke:#5b6569;stroke-dasharray:6 4}.street{fill:#ddd}.garden{fill:#eef5f3}.car{fill:none;stroke:#888;stroke-dasharray:3 2}.glass{stroke:#4f8fb8;fill:none}.door,.stair{stroke:#1d2327;fill:none}.swing{stroke:#888;fill:none;stroke-dasharray:2 2}.arrow{stroke:#1e6c68;fill:none}.dim,.lvl{stroke:#5b6569;fill:none}.rampa,.lim{stroke:#9a6b12;fill:none}.limmax{stroke:#b3261e;fill:none;stroke-dasharray:7 4}.ground{stroke:#1d2327;fill:none}.soil{fill:#dcd5c3}text{font-family:Arial,sans-serif;fill:#1d2327}.area,.dimt{fill:#5b6569}.bel{fill:#9a6b12}.acc{fill:#1e6c68}</style>`;
/* ZIP sin compresión (para entregar el DXF donde solo se admiten ciertos formatos) */
function zipStore(name, text){
  const data = new TextEncoder().encode(text), fn = new TextEncoder().encode(name);
  let c = ~0; for (let i = 0; i < data.length; i++){ c ^= data[i]; for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (0xEDB88320 & -(c & 1)); } c = ~c >>> 0;
  const lh = new DataView(new ArrayBuffer(30)), ch = new DataView(new ArrayBuffer(46)), ed = new DataView(new ArrayBuffer(22));
  [[0,0x04034b50,4],[4,20,2],[8,0,2],[14,c,4],[18,data.length,4],[22,data.length,4],[26,fn.length,2]].forEach(([o,v,n]) => n === 4 ? lh.setUint32(o, v, true) : lh.setUint16(o, v, true));
  [[0,0x02014b50,4],[4,20,2],[6,20,2],[16,c,4],[20,data.length,4],[24,data.length,4],[28,fn.length,2],[42,0,4]].forEach(([o,v,n]) => n === 4 ? ch.setUint32(o, v, true) : ch.setUint16(o, v, true));
  const cdOff = 30 + fn.length + data.length;
  [[0,0x06054b50,4],[8,1,2],[10,1,2],[12,46 + fn.length,4],[16,cdOff,4]].forEach(([o,v,n]) => n === 4 ? ed.setUint32(o, v, true) : ed.setUint16(o, v, true));
  return new Blob([lh.buffer, fn, data, ch.buffer, fn, ed.buffer]);
}
let DL = null;
if (window.claude && window.claude.use) window.claude.use("downloads").then(d => { DL = d; }).catch(() => {});
async function download(name, text, type){
  if (DL){
    let filename = name, data = text;
    if (/\.dxf$/.test(name)){ filename = name.replace(/\.dxf$/, ".zip"); data = zipStore(name, text); }
    try { await DL.save({ filename, data }); toast("Archivo guardado: " + filename + (filename !== name ? " (contiene " + name + ")" : "")); }
    catch(e){ toast(e && e.code === "declined" ? "Descarga cancelada." : "No se pudo guardar. Usa «Copiar DXF»."); }
    return;
  }
  try {
    const blob = new Blob([text], { type });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast("Descarga iniciada: " + name + ".");
  } catch(e){ toast("No se pudo descargar. Usa «Copiar DXF»."); }
}
function toast(t){ const el = $("#toast"); if (el){ el.textContent = t; clearTimeout(toast.t); toast.t = setTimeout(() => { el.textContent = ""; }, 5000); } }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]");
  if (t){ TAB = t.dataset.tab; try { localStorage.setItem(KEY + ":tab", TAB); } catch(_) {} render(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "dxf") download("vivienda-semisotano.dxf", dxfAll(), "application/dxf");
  if (act === "svg"){
    const svgs = [...document.querySelectorAll("#view .svgbox svg")];
    const s = svgs.map(x => x.outerHTML.replace(/fill="url\(#h\d+\)"/g, 'fill="#1e6c68" fill-opacity="0.35"').replace(/^<svg /, "<svg " + (/xmlns=/.test(x.outerHTML) ? "" : 'xmlns="http://www.w3.org/2000/svg" ')).replace(/>/, ">" + SVG_STYLE));
    download("vivienda-semisotano-" + TAB + ".svg", s[0] || "", "image/svg+xml");
  }
  if (act === "applyUA"){
    Object.assign(P, { tipo:"adosada", edif:150, modo:"ajustar", alturaMax:7.5, ocupMax:60, retFrente:3, retFondo:3, retLat:3, coef:+(UA.edif / UA.sup).toFixed(3), fondoMax:30, garaje:P.ord.esquema !== "patio" && P.ord.parking === "rampa" });
    /* parcela equivalente por vivienda: 8.839 m² / 34 viviendas, con el frente del módulo */
    P.frente = +P.W.toFixed(2); P.fondo = +(UA.sup / UA.viv / P.W).toFixed(2); P.nUnid = 10;
    if (P.ord.esquema === "patio") P.prog.ss.calle = [{ t:"Trastero", a:6 }, { t:"Paso a garaje comunitario", a:8 }];
    buildPanel(); schedule(); toast("Ordenanza UA-03-01 aplicada a la vivienda: adosada, 7,50 m, 60 %, retranqueos 3 m" + (P.garaje ? " y garaje propio con rampa." : ".")); return; }
  if (act === "resetprog"){ P.prog = clone(PROG_DEF); schedule(); return; }
  if (act === "json") download("vivienda-semisotano.json", JSON.stringify(P, null, 2), "application/json");
  if (act === "copydxf"){
    const txt = dxfAll();
    const fallback = () => { $("#outbox").innerHTML = `<p class="note">Selecciona todo el texto, cópialo y guárdalo como <b>vivienda.dxf</b>.</p><textarea class="out" id="dxfout" readonly></textarea>`; const ta = $("#dxfout"); ta.value = txt; ta.focus(); ta.select(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast("DXF copiado al portapapeles. Pégalo en un archivo .dxf."), fallback);
    else fallback();
  }
});
document.addEventListener("input", e => {
  const ok = e.target.dataset && e.target.dataset.ord;
  if (ok){ const v = parseFloat(e.target.value); if (!isNaN(v)){ P.ord[ok] = v; schedule(true); } return; }
  const pa = e.target.dataset && e.target.dataset.pga; if (!pa) return;
  const v = parseFloat(e.target.value); if (isNaN(v)) return;
  const [lv, z, i] = pa.split("."); P.prog[lv][z][+i].a = Math.max(0, v); schedule(true);
});
document.addEventListener("change", e => {
  if (e.target.dataset && e.target.dataset.ords){ P.ord[e.target.dataset.ords] = e.target.value; schedule(true); return; }
  if (e.target.dataset && e.target.dataset.ordc){ P.ord[e.target.dataset.ordc] = e.target.checked; schedule(true); return; }
  const pg = e.target.dataset && e.target.dataset.pg;
  if (pg){ const [lv, z, i] = pg.split("."); const q = P.prog[lv][z][+i]; q.t = e.target.value;
    if (q.t && (!q.a || q.a < 0.5)) q.a = Math.max(CAT[q.t].min || 4, 4); schedule(); return; }
  if (e.target.id !== "imp" || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => { try { const o = JSON.parse(r.result); P = Object.assign({}, DEF, o, { prog:normProg(o.prog), ord:o.ord }); P.ord = Object.assign({}, ORD_DEF, P.ord && P.ord.esquema ? P.ord : {}); save(); buildPanel(); render(); toast("Parámetros importados."); } catch(err){ toast("El archivo no es un JSON de parámetros válido."); } };
  r.readAsText(e.target.files[0]);
});

P.ord = Object.assign({}, ORD_DEF, P.ord && P.ord.esquema ? P.ord : {});
buildPanel();
render();
})();
