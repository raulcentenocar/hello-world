# Criterios de búsqueda de piso en Sevilla
# Edita este archivo para cambiar lo que buscas; no hace falta tocar el código.

[criterios]
operacion = "rent"            # alquiler
precio_max = 900              # € / mes (incluido)
dormitorios_min = 2
dormitorios_max = 2           # pon 3 si también te valen pisos de 3 dormitorios
superficie_min = 0            # m² (0 = sin mínimo)
excluir_bajos = false         # true = descarta plantas bajas / sótanos

# Zona de búsqueda en el portal: un círculo que cubre todas las zonas de abajo.
# Después se filtra con precisión por barrio y por distancia a cada zona.
[busqueda]
centro_lat = 37.3800
centro_lon = -5.9720
radio_m = 3500

# Zonas que te interesan.
#  - nombres: textos que pueden aparecer en el barrio, distrito o dirección del anuncio
#  - lat/lon: punto central aproximado de la zona
#  - radio_m: un anuncio dentro de este radio también cuenta como "en la zona"
[[zonas]]
nombre = "Viapol"
nombres = ["viapol", "huerta del pilar"]
lat = 37.3829
lon = -5.9786
radio_m = 450

[[zonas]]
nombre = "Gran Plaza"
